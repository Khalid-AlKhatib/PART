name: PART Direct Answers on Varied Attacks

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN to approve 300 OpenRouter requests'
        required: true
        default: 'NO'
        type: string

permissions:
  contents: read

jobs:
  direct-answers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Confirm paid evaluation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != 'RUN' ]; then
            echo 'Not running: enter RUN to approve calls.'
            exit 1
          fi

      - name: Validate cases and direct-answer prompts
        run: |
          python3 -m unittest discover -s tests -v
          python3 experiments/run_direct_varied.py --dry-run

      - name: Evaluate direct answers with three small LLMs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 experiments/run_direct_varied.py \
            --data experiments/varied_attacks_50.jsonl \
            --workers 3 \
            --output-dir results/direct_varied

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-direct-varied-${{ github.run_id }}
          path: results/direct_varied/
          if-no-files-found: ignore
