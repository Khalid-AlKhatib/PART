name: PART Varied Attack Graph Extraction

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN to approve 150 OpenRouter requests'
        required: true
        default: 'NO'
        type: string

permissions:
  contents: read

jobs:
  extract-attacks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Confirm paid evaluation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != 'RUN' ]; then
            echo 'Not running: enter RUN to approve calls.'
            exit 1
          fi

      - name: Reproduce 50 cases and run unit tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 experiments/make_varied_attacks.py --output /tmp/varied_attacks_check.jsonl
          cmp /tmp/varied_attacks_check.jsonl experiments/varied_attacks_50.jsonl

      - name: Extract attacks with three small LLMs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 experiments/run_graph_extraction.py \
            --data experiments/varied_attacks_50.jsonl \
            --workers 3 \
            --output-dir results/graph_extraction

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-varied-attacks-${{ github.run_id }}
          path: results/graph_extraction/
          if-no-files-found: ignore
